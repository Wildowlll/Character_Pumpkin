<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>캐릭터 호박 조각</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>
  :root{
    --bg:#1d1730; --card:#2a2242; --ink:#f3ecff; --sub:#a99cc4; --line:#40355e;
    --accent:#ff8a2a; --accent-ink:#1d1730; --soft:#352a52; --seg:#211a36;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;}
  .app{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
  header h1{margin:0;font-size:24px;letter-spacing:-.5px}
  header p{margin:4px 0 0;color:var(--sub);font-size:14px}
  main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;margin-top:18px;align-items:start}
  @media (max-width:820px){main{grid-template-columns:1fr}}
  .stage{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;
    display:flex;justify-content:center}
  .stage.drag{outline:3px dashed var(--accent);outline-offset:-8px}
  canvas#cv{width:100%;max-width:500px;height:auto;display:block;border-radius:12px}
  .panel{display:flex;flex-direction:column;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:700}
  .drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;
    cursor:pointer;font-size:14px;transition:.15s}
  .drop:hover{border-color:var(--accent);background:var(--soft)}
  .drop small{color:var(--sub);font-size:12px}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .thumb{position:relative;width:60px;height:60px;border-radius:10px;background:#140f22 center/80% no-repeat;
    border:1px solid var(--line)}
  .thumb button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;
    background:var(--ink);color:var(--bg);font-size:12px;line-height:20px;cursor:pointer;padding:0}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0;font-size:14px}
  .row input[type=text]{width:170px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;
    color:var(--ink);background:var(--seg);font-family:inherit}
  .seg{display:flex;background:var(--seg);border-radius:10px;padding:3px}
  .seg label{position:relative}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg span{display:block;padding:5px 10px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap}
  .seg input:checked+span{background:var(--soft);box-shadow:0 1px 3px rgba(0,0,0,.3);font-weight:700}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0;cursor:pointer}
  .check input{accent-color:var(--accent);width:16px;height:16px}
  button.primary{width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;
    background:var(--accent);color:var(--accent-ink);cursor:pointer}
  button.primary:active{transform:translateY(1px)}
  button.secondary{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 12px;
    font-size:14px;cursor:pointer;color:var(--ink);font-weight:700}
  button:disabled{opacity:.5;cursor:default}
  select{border:1px solid var(--line);border-radius:8px;padding:6px;font-size:13px;background:var(--seg);color:var(--ink)}
  #status{font-size:13px;color:var(--sub);margin:8px 0 0;min-height:1em}
  #preview{width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--line)}
  .foot{color:var(--sub);font-size:12px;margin-top:16px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🎃 캐릭터 호박 조각</h1>
    <p>캐릭터를 호박에 조각하고 촛불을 켜보세요.</p>
  </header>
  <main>
    <div class="stage" id="stage"><canvas id="cv"></canvas></div>
    <aside class="panel">
      <section class="card">
        <h2>1. 도안 넣기</h2>
        <label class="drop" id="drop">
          <input type="file" id="file" accept="image/*" multiple hidden>
          <span>클릭하거나 이미지를 끌어다 놓기<br><small>배경 투명 PNG 추천 · 최대 3명 · Ctrl+V 붙여넣기 가능</small></span>
        </label>
        <div class="thumbs" id="thumbs"></div>
      </section>

      <section class="card">
        <h2>2. 조각 설정</h2>
        <div class="row">조각 방식
          <div class="seg">
            <label><input type="radio" name="style" value="fill" data-k="style" checked><span>면 파기</span></label>
            <label><input type="radio" name="style" value="line" data-k="style"><span>선 파기</span></label>
          </div>
        </div>
        <div class="row">촛불
          <div class="seg">
            <label><input type="radio" name="flame" value="gold" data-k="flame" checked><span>노랑</span></label>
            <label><input type="radio" name="flame" value="violet" data-k="flame"><span>보라</span></label>
            <label><input type="radio" name="flame" value="ghost" data-k="flame"><span>도깨비불</span></label>
          </div>
        </div>
        <div class="row">호박
          <div class="seg">
            <label><input type="radio" name="skin" value="orange" data-k="skin" checked><span>주황</span></label>
            <label><input type="radio" name="skin" value="white" data-k="skin"><span>하양</span></label>
          </div>
        </div>
        <div class="row">문구 <input type="text" data-k="caption" value="Happy Halloween" maxlength="20"></div>
        <label class="check"><input type="checkbox" data-k="sound" checked>🔔 효과음</label>
      </section>

      <section class="card">
        <button class="primary" id="start">🔪 조각 시작</button>
        <div class="row" style="margin-top:12px">
          <select id="gifsize">
            <option value="0.72">GIF 보통 (360px)</option>
            <option value="0.54">GIF 작게 (270px)</option>
          </select>
          <button class="secondary" id="gif">GIF로 저장</button>
        </div>
        <p id="status"></p>
        <img id="preview" alt="" hidden>
      </section>
    </aside>
  </main>
  <p class="foot">이미지는 서버로 올라가지 않고 브라우저 안에서만 처리돼요.</p>
</div>

<script>
/* ===================== 유틸 ===================== */
const W = 500, H = 500, GROUND = 425;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.width = W * DPR; cv.height = H * DPR;

const TAU = Math.PI * 2;
const rand = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const pr = (t, [a, b]) => clamp((t - a) / (b - a), 0, 1);
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixc = (a, b, p) => a.map((v, i) => Math.round(lerp(v, b[i], p)));
const rgba = (a, al = 1) => `rgba(${a[0]},${a[1]},${a[2]},${al})`;
const FONT = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif';

/* ===================== 상태 ===================== */
const S = { chars: [], style: 'fill', flame: 'gold', skin: 'orange', caption: 'Happy Halloween', sound: true };
const FLAMES = {
  gold:   { core: hex('#fff4c2'), mid: hex('#ffb547'), edge: hex('#ff7417') },
  violet: { core: hex('#f6e4ff'), mid: hex('#c27cff'), edge: hex('#7b2cff') },
  ghost:  { core: hex('#eaffd9'), mid: hex('#8dff6a'), edge: hex('#23b85a') },
};
const SKINS = {
  orange: { base: '#ff9b3d', shade: '#e8701f', crease: '#d4621a', out: '#5a2a12', hi: 'rgba(255,244,214,0.75)', stem: '#8a8a3c' },
  white:  { base: '#fbf5e6', shade: '#e0d3b4', crease: '#c9ba94', out: '#5b4a35', hi: 'rgba(255,255,255,0.9)',   stem: '#8a8a3c' },
};
const FLESH = hex('#f2b45c'), HOLE = hex('#1c0c04');

/* ===================== 타임라인 ===================== */
const T = {
  carve: [0.6, 2.6], lidUp: [2.65, 3.0], candle: [2.9, 3.25], lidDown: [3.25, 3.55],
  light: [3.55, 3.95], caption: [4.3, 4.9], total: 8.0,
};
const ROWS = 6;
function glowAt(t) {
  if (t < T.light[0]) return 0;
  const p = pr(t, T.light);
  // 켜졌다 → 꺼질 뻔 → 켜짐
  const blink = p < 0.3 ? p / 0.3 : p < 0.5 ? lerp(1, 0.25, (p - 0.3) / 0.2) : lerp(0.25, 1, (p - 0.5) / 0.5);
  const flick = 0.86 + 0.08 * Math.sin(t * 13) + 0.06 * Math.sin(t * 31 + 1);
  return blink * flick;
}
function lidState(t) {
  if (t < T.lidUp[0]) return { off: false, dy: 0, rot: 0 };
  if (t < T.lidUp[1]) { const p = easeOut(pr(t, T.lidUp)); return { off: true, dy: -55 * p, rot: -0.35 * p }; }
  if (t < T.lidDown[0]) return { off: true, dy: -55, rot: -0.35 };
  if (t < T.lidDown[1]) { const p = easeInOut(pr(t, T.lidDown)); return { off: p < 1, dy: lerp(-55, 0, p), rot: lerp(-0.35, 0, p) }; }
  return { off: false, dy: 0, rot: 0 };
}

/* ===================== 도안 → 조각 스프라이트 ===================== */
function prep(img) {
  const m = 480, s = Math.min(1, m / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
  const c = mk(w, h), x = c.getContext('2d');
  x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1, trans = 0;
  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) {
    const a = d[(y * w + i) * 4 + 3];
    if (a < 200) trans++;
    if (a > 12) { if (i < x0) x0 = i; if (i > x1) x1 = i; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) { x0 = 0; y0 = 0; x1 = w - 1; y1 = h - 1; }
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1, k = 240 / Math.max(cw, ch);
  const src = mk(cw * k, ch * k);
  src.getContext('2d').drawImage(c, x0, y0, cw, ch, 0, 0, src.width, src.height);
  return { src, opaque: trans / (w * h) < 0.03 };
}
function blurred(M, f) {
  const s = mk(M.width / f, M.height / f), sx = s.getContext('2d');
  sx.imageSmoothingQuality = 'high'; sx.drawImage(M, 0, 0, s.width, s.height);
  const b = mk(M.width, M.height), bx = b.getContext('2d');
  bx.imageSmoothingQuality = 'high'; bx.drawImage(s, 0, 0, b.width, b.height);
  return b;
}
// g = 0(껍질 그대로) ~ 1(완전히 뚫림)
function carveMap(ch, style) {
  const { src, opaque } = ch, w = src.width, h = src.height;
  const d = src.getContext('2d').getImageData(0, 0, w, h).data;
  const g = new Float32Array(w * h);
  const mode = opaque ? 'line' : style;
  for (let i = 0; i < w * h; i++) {
    const a = d[i * 4 + 3] / 255, L = (0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]) / 255;
    g[i] = mode === 'fill' ? a * Math.pow(L, 0.8) : a * clamp((1 - L - 0.1) / 0.9, 0, 1);
  }
  if (mode === 'line') {   // 선을 조금 굵게 (칼로 팔 수 있는 굵기)
    const o = new Float32Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let m = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const xx = x + dx, yy = y + dy;
        if (xx >= 0 && yy >= 0 && xx < w && yy < h) m = Math.max(m, g[yy * w + xx]);
      }
      o[y * w + x] = m;
    }
    return o;
  }
  return g;
}
function buildCarve(ch) {
  const key = S.style + '|' + S.flame;
  if (ch.cache[key]) return ch.cache[key];
  const w = ch.src.width, h = ch.src.height, g = carveMap(ch, S.style), F = FLAMES[S.flame];
  const unlit = mk(w, h), lit = mk(w, h);
  const ux = unlit.getContext('2d'), lx = lit.getContext('2d');
  const ud = ux.createImageData(w, h), ld = lx.createImageData(w, h);
  for (let i = 0; i < w * h; i++) {
    const v = g[i], j = i * 4;
    const shave = smooth(0.12, 0.5, v), hole = smooth(0.55, 0.7, v);
    const uc = mixc(FLESH, HOLE, hole);
    ud.data[j] = uc[0]; ud.data[j + 1] = uc[1]; ud.data[j + 2] = uc[2];
    ud.data[j + 3] = 255 * Math.max(shave * 0.85, hole);
    const tt = smooth(0.12, 1, v);
    const lc = tt < 0.5 ? mixc(F.edge, F.mid, tt * 2) : mixc(F.mid, F.core, (tt - 0.5) * 2);
    ld.data[j] = lc[0]; ld.data[j + 1] = lc[1]; ld.data[j + 2] = lc[2];
    ld.data[j + 3] = 255 * smooth(0.1, 0.4, v);
  }
  ux.putImageData(ud, 0, 0); lx.putImageData(ld, 0, 0);
  const BP = 36, padded = mk(w + BP * 2, h + BP * 2);
  padded.getContext('2d').drawImage(lit, BP, BP);
  const bloom = blurred(blurred(padded, 5), 3);
  return (ch.cache[key] = { unlit, lit, bloom, BP });
}
function makeChar(img) { const p = prep(img); return { ...p, cache: {} }; }

/* ===================== 호박 몸통 스프라이트 ===================== */
const bodyCache = {};
function lidEllipse(c, pw, ph, k = 1) { c.beginPath(); c.ellipse(0, -ph * 0.95, pw * 0.2 * k, ph * 0.1 * k, 0, 0, TAU); }
function lidRegion(c, pw, ph) { lidEllipse(c, pw, ph); c.rect(-pw * 0.18, -ph * 1.3, pw * 0.36, ph * 0.34); }
function colorize(src, col) {
  const c = mk(src.width, src.height), x = c.getContext('2d');
  x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-in';
  x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
  x.globalCompositeOperation = 'source-over';
  return c;
}
function pumpkinSprites(pw, ph, skinKey) {
  const key = `${pw}|${ph}|${skinKey}`;
  if (bodyCache[key]) return bodyCache[key];
  const sk = SKINS[skinKey], pad = 24;
  const cw = pw * 1.12 + pad * 2, chh = ph * 1.3 + pad * 2;
  const ox = cw / 2, oy = chh - pad;
  const lw = Math.max(2.5, pw * 0.014);
  // 실루엣 마스크
  const mask = mk(cw, chh), m = mask.getContext('2d');
  m.translate(ox, oy); m.fillStyle = '#000';
  const lobes = [[-0.3, 0.42, 0.86], [0.3, 0.42, 0.86], [-0.15, 0.5, 0.96], [0.15, 0.5, 0.96], [0, 0.5, 1]];
  for (const [o, wf, hf] of lobes) {
    const ry = ph * 0.5 * hf;
    m.beginPath(); m.ellipse(o * pw, -ry, wf * pw / 2, ry, 0, 0, TAU); m.fill();
  }
  // 색칠 + 셀 음영
  const F = colorize(mask, sk.base), f = F.getContext('2d');
  const sh = colorize(mask, sk.shade), sx = sh.getContext('2d');
  sx.globalCompositeOperation = 'destination-out';
  sx.beginPath(); sx.ellipse(ox - pw * 0.06, oy - ph * 0.56, pw * 0.5, ph * 0.5, 0, 0, TAU); sx.fill();
  f.drawImage(sh, 0, 0);
  f.translate(ox, oy);
  f.globalCompositeOperation = 'source-atop';
  f.strokeStyle = sk.crease; f.lineWidth = pw * 0.013; f.lineCap = 'round';
  for (const xb of [-0.23, -0.075, 0.075, 0.23]) {
    f.beginPath();
    f.moveTo(xb * pw * 0.45, -ph * 0.93);
    f.quadraticCurveTo(xb * pw * 1.38, -ph * 0.5, xb * pw * 0.62, -ph * 0.03);
    f.stroke();
  }
  f.fillStyle = sk.crease; f.globalAlpha = 0.6;
  f.beginPath(); f.ellipse(0, -ph * 0.94, pw * 0.07, ph * 0.03, 0, 0, TAU); f.fill();
  f.globalAlpha = 1;
  f.strokeStyle = sk.hi; f.lineWidth = pw * 0.028;
  f.beginPath(); f.moveTo(-pw * 0.36, -ph * 0.55); f.quadraticCurveTo(-pw * 0.35, -ph * 0.8, -pw * 0.22, -ph * 0.87); f.stroke();
  f.fillStyle = sk.hi; f.beginPath(); f.arc(-pw * 0.37, -ph * 0.44, pw * 0.014, 0, TAU); f.fill();
  // 몸통 = 외곽선 + 색
  const body = mk(cw, chh), b = body.getContext('2d');
  const outl = colorize(mask, sk.out);
  for (let k = 0; k < 16; k++) { const a = k * TAU / 16; b.drawImage(outl, Math.cos(a) * lw, Math.sin(a) * lw); }
  b.drawImage(F, 0, 0);
  b.translate(ox, oy);
  b.lineJoin = 'round'; b.lineCap = 'round';
  // 덩굴
  b.beginPath();
  b.moveTo(pw * 0.03, -ph * 1.02);
  b.bezierCurveTo(pw * 0.12, -ph * 1.0, pw * 0.15, -ph * 1.12, pw * 0.1, -ph * 1.13);
  b.bezierCurveTo(pw * 0.06, -ph * 1.14, pw * 0.07, -ph * 1.06, pw * 0.11, -ph * 1.07);
  b.strokeStyle = sk.out; b.lineWidth = lw * 2.2; b.stroke();
  b.strokeStyle = '#7fb24a'; b.lineWidth = lw * 0.9; b.stroke();
  // 잎
  b.save(); b.translate(-pw * 0.05, -ph * 1.02); b.rotate(-0.5);
  b.beginPath(); b.moveTo(0, 0);
  b.quadraticCurveTo(-pw * 0.06, -ph * 0.07, -pw * 0.13, -ph * 0.02);
  b.quadraticCurveTo(-pw * 0.07, ph * 0.04, 0, 0);
  b.fillStyle = '#8cc152'; b.fill(); b.strokeStyle = sk.out; b.lineWidth = lw; b.stroke();
  b.beginPath(); b.moveTo(-pw * 0.01, -ph * 0.002); b.lineTo(-pw * 0.09, -ph * 0.02);
  b.strokeStyle = 'rgba(60,90,30,0.6)'; b.lineWidth = lw * 0.6; b.stroke();
  b.restore();
  // 꼭지
  b.beginPath();
  b.moveTo(-pw * 0.04, -ph * 0.93);
  b.quadraticCurveTo(-pw * 0.045, -ph * 1.08, -pw * 0.005, -ph * 1.16);
  b.lineTo(pw * 0.045, -ph * 1.13);
  b.quadraticCurveTo(pw * 0.02, -ph * 1.06, pw * 0.04, -ph * 0.93);
  b.quadraticCurveTo(0, -ph * 0.9, -pw * 0.04, -ph * 0.93);
  b.closePath();
  b.fillStyle = sk.stem; b.fill(); b.strokeStyle = sk.out; b.lineWidth = lw; b.stroke();
  b.strokeStyle = 'rgba(255,255,220,0.35)'; b.lineWidth = lw * 0.8;
  b.beginPath(); b.moveTo(-pw * 0.02, -ph * 0.97); b.quadraticCurveTo(-pw * 0.025, -ph * 1.07, -pw * 0.005, -ph * 1.12); b.stroke();
  // 뚜껑 / 뚜껑 뺀 몸통
  const lid = mk(cw, chh), l = lid.getContext('2d');
  l.drawImage(body, 0, 0);
  l.globalCompositeOperation = 'destination-in'; l.translate(ox, oy);
  l.beginPath(); lidRegion(l, pw, ph); l.fill();
  const open = mk(cw, chh), o = open.getContext('2d');
  o.drawImage(body, 0, 0); o.translate(ox, oy);
  o.globalCompositeOperation = 'destination-out'; o.beginPath(); lidRegion(o, pw, ph); o.fill();
  o.globalCompositeOperation = 'source-over';
  lidEllipse(o, pw, ph, 1.0); o.fillStyle = sk.out; o.fill();
  lidEllipse(o, pw, ph, 0.95); o.fillStyle = rgba(FLESH); o.fill();
  o.fillStyle = rgba(HOLE); o.beginPath(); o.ellipse(0, -ph * 0.935, pw * 0.16, ph * 0.062, 0, 0, TAU); o.fill();
  const lidT = mk(cw, chh), lt = lidT.getContext('2d');
  lt.drawImage(lid, 0, 0); lt.globalCompositeOperation = 'source-atop';
  lt.fillStyle = 'rgba(28,22,75,0.42)'; lt.fillRect(0, 0, cw, chh);

/* ===================== 배치 ===================== */
function layout(n) {
  if (n <= 1) return [{ x: 250, pw: 290, ph: 240 }];
  if (n === 2) return [{ x: 150, pw: 220, ph: 185 }, { x: 355, pw: 232, ph: 195 }];
  return [{ x: 95, pw: 165, ph: 140 }, { x: 250, pw: 212, ph: 180 }, { x: 405, pw: 165, ph: 140 }];
}
function faceRect(pw, ph, spr) {
  const bw = pw * 0.62, bh = ph * 0.56, k = Math.min(bw / spr.width, bh / spr.height);
  const w = spr.width * k, h = spr.height * k;
  return { x: -w / 2, y: -ph * 0.47 - h / 2, w, h };
}
function carveProgress(t) { return pr(t, T.carve); }
function knifeLocal(c, fr) {
  const rf = c * ROWS, row = Math.min(ROWS - 1, Math.floor(rf)), f = c >= 1 ? 1 : rf - row;
  const xf = row % 2 ? 1 - f : f;
  return { x: fr.x + xf * fr.w, y: fr.y + (row + 0.5) * fr.h / ROWS, row, f, xf };
}
function revealClip(c, cx, fr, prog) {
  c.beginPath();
  if (prog >= 1) { c.rect(fr.x - 2, fr.y - 2, fr.w + 4, fr.h + 4); return; }
  const k = knifeLocal(prog, fr), rh = fr.h / ROWS;
  c.rect(fr.x - 2, fr.y - 2, fr.w + 4, k.row * rh + 2);
  const y = fr.y + k.row * rh;
  if (k.row % 2 === 0) c.rect(fr.x - 2, y, k.xf * fr.w + 2, rh);
  else c.rect(fr.x + k.xf * fr.w, y, (1 - k.xf) * fr.w + 2, rh);
}

/* ===================== 배경 ===================== */
function drawSky(c, t) {
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#120d26'); g.addColorStop(0.65, '#2d1f4d'); g.addColorStop(1, '#3b2558');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  for (let k = 0; k < 45; k++) {
    const x = rand(k) * W, y = rand(k + 50) * 300, tw = 0.5 + 0.5 * Math.sin(t * (2 + rand(k + 9) * 3) + k);
    c.fillStyle = `rgba(255,248,220,${0.25 + 0.6 * tw * rand(k + 20)})`;
    c.fillRect(x, y, rand(k + 30) > 0.85 ? 2 : 1.2, rand(k + 30) > 0.85 ? 2 : 1.2);
  }
  const mh = c.createRadialGradient(420, 82, 30, 420, 82, 110);
  mh.addColorStop(0, 'rgba(255,240,200,0.28)'); mh.addColorStop(1, 'rgba(255,240,200,0)');
  c.fillStyle = mh; c.fillRect(300, 0, 200, 200);
  c.fillStyle = '#fff3d6'; c.beginPath(); c.arc(420, 82, 34, 0, TAU); c.fill();
  c.fillStyle = 'rgba(220,200,160,0.45)';
  for (const [dx, dy, r] of [[-10, -8, 7], [9, 6, 5], [-4, 14, 4], [13, -12, 3]]) { c.beginPath(); c.arc(420 + dx, 82 + dy, r, 0, TAU); c.fill(); }
  // 나무
  c.strokeStyle = '#0e0a1a'; c.lineCap = 'round';
  c.lineWidth = 14; c.beginPath(); c.moveTo(-10, 430); c.quadraticCurveTo(30, 300, 10, 160); c.stroke();
  c.lineWidth = 7; c.beginPath(); c.moveTo(18, 260); c.quadraticCurveTo(70, 230, 105, 245); c.stroke();
  c.lineWidth = 5; c.beginPath(); c.moveTo(14, 200); c.quadraticCurveTo(50, 165, 80, 170); c.stroke();
  c.lineWidth = 3; c.beginPath(); c.moveTo(75, 238); c.lineTo(92, 218); c.moveTo(60, 172); c.lineTo(70, 152); c.stroke();
  // 울타리
  c.fillStyle = '#17112a';
  for (let x = 300; x < W; x += 22) { c.beginPath(); c.moveTo(x, 420); c.lineTo(x, 362); c.lineTo(x + 6, 352); c.lineTo(x + 12, 362); c.lineTo(x + 12, 420); c.fill(); }
  c.fillRect(296, 372, 210, 6); c.fillRect(296, 396, 210, 6);
}
function drawGround(c, glow, F) {
  c.fillStyle = '#120c1f';
  c.beginPath(); c.moveTo(0, 418);
  for (let x = 0; x <= W; x += 10) c.lineTo(x, 418 + Math.sin(x * 0.03) * 4 - (rand(x) > 0.7 ? 6 : 0));
  c.lineTo(W, H); c.lineTo(0, H); c.closePath(); c.fill();
  if (glow > 0) {
    c.save(); c.globalCompositeOperation = 'lighter';
    const g = c.createRadialGradient(250, GROUND, 10, 250, GROUND, 260);
    g.addColorStop(0, rgba(F.edge, 0.32 * glow)); g.addColorStop(1, rgba(F.edge, 0));
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.restore();
  }
}
function bat(c, x, y, s, t, k) {
  const fl = Math.sin(t * 22 + k * 2);
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = '#0b0714';
  c.beginPath();
  c.moveTo(0, 0);
  c.quadraticCurveTo(-8, -10 * fl - 2, -18, -4 * fl);
  c.quadraticCurveTo(-13, 2, -9, 1); c.quadraticCurveTo(-6, 5, 0, 3);
  c.quadraticCurveTo(6, 5, 9, 1); c.quadraticCurveTo(13, 2, 18, -4 * fl);
  c.quadraticCurveTo(8, -10 * fl - 2, 0, 0);
  c.fill();
  c.beginPath(); c.ellipse(0, 1, 3.5, 4.5, 0, 0, TAU); c.fill();
  c.beginPath(); c.moveTo(-3, -2); c.lineTo(-2.5, -6); c.lineTo(-1, -3); c.moveTo(3, -2); c.lineTo(2.5, -6); c.lineTo(1, -3); c.fill();
  c.restore();
}
function drawBats(c, t) {
  [[4.3, 1, 140, 1.1], [4.75, -1, 105, 0.8], [5.3, 1, 190, 0.65]].forEach(([t0, dir, y0, s], k) => {
    const p = (t - t0) / 2.6;
    if (p < 0 || p > 1) return;
    const x = dir > 0 ? lerp(-30, 530, p) : lerp(530, -30, p);
    bat(c, x, y0 + Math.sin(p * 9 + k) * 14, s, t, k);
  });
}

/* ===================== 칼·조각 부스러기·초 ===================== */
function knife(c, x, y, s, t) {
  c.save(); c.translate(x, y); c.rotate(-0.7 + Math.sin(t * 28) * 0.12); c.scale(s, s);
  c.fillStyle = '#d9dee6'; c.strokeStyle = '#8b939e'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(0, 0); c.lineTo(5, -30); c.lineTo(-2, -30); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#6b3e1f'; rr(c, -4, -52, 10, 23, 3); c.fill();
  c.restore();
}
function chunks(c, t, origins) {
  const n = 26, [c0, c1] = T.carve;
  for (const o of origins) for (let k = 0; k < n; k++) {
    const ts = c0 + (k / n) * (c1 - c0), age = t - ts;
    if (age < 0 || age > 0.7) continue;
    const kp = o.at(ts);
    const vx = (rand(k + o.seed) - 0.5) * 140, vy = -70 - rand(k + 7 + o.seed) * 70;
    const x = kp.x + vx * age, y = kp.y + vy * age + 260 * age * age;
    c.save(); c.translate(x, y); c.rotate(age * 12 + k);
    c.globalAlpha = 1 - age / 0.7;
    c.fillStyle = k % 3 ? '#f08a2a' : '#f7c26a';
    const r = 2 + rand(k + 3) * 2.5;
    c.beginPath(); c.moveTo(-r, -r * 0.6); c.lineTo(r, -r * 0.3); c.lineTo(0, r); c.closePath(); c.fill();
    c.restore();
  }
}
function candle(c, x, y, s, t, F) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = '#f4ecd8'; rr(c, -6, -22, 12, 22, 2); c.fill();
  c.fillStyle = '#3a2a1a'; c.fillRect(-0.8, -27, 1.6, 5);
  const fl = 1 + Math.sin(t * 25) * 0.08;
  const g = c.createRadialGradient(0, -32, 1, 0, -32, 16);
  g.addColorStop(0, rgba(F.core, 0.9)); g.addColorStop(1, rgba(F.edge, 0));
  c.fillStyle = g; c.beginPath(); c.arc(0, -32, 16, 0, TAU); c.fill();
  c.fillStyle = rgba(F.mid);
  c.beginPath(); c.moveTo(0, -42 * fl); c.quadraticCurveTo(6, -30, 0, -26); c.quadraticCurveTo(-6, -30, 0, -42 * fl); c.fill();
  c.fillStyle = rgba(F.core);
  c.beginPath(); c.moveTo(0, -36 * fl); c.quadraticCurveTo(3, -30, 0, -27.5); c.quadraticCurveTo(-3, -30, 0, -36 * fl); c.fill();
  c.restore();
}

/* ===================== 장면 ===================== */
const layers = [mk(10, 10), mk(10, 10), mk(10, 10)];
function drawPumpkin(c, i, L, ch, t, glow, F) {
  const { x, pw, ph } = L;
  const sp = pumpkinSprites(pw, ph, S.skin);
  const lay = layers[i];
  if (lay.width !== sp.cw || lay.height !== sp.chh) { lay.width = Math.round(sp.cw); lay.height = Math.round(sp.chh); }
  const lx = lay.getContext('2d');
  lx.setTransform(1, 0, 0, 1, 0, 0); lx.clearRect(0, 0, lay.width, lay.height);
  const lid = lidState(t);
  lx.drawImage(lid.off ? sp.open : sp.body, 0, 0);
  lx.translate(sp.ox, sp.oy);
  const prog = carveProgress(t);
  let car = null, fr = null;
  if (ch) {
    car = buildCarve(ch);
    fr = faceRect(pw, ph, car.unlit);
    if (prog > 0) {
      lx.save();
      lx.beginPath(); lx.ellipse(0, -ph * 0.5, pw * 0.44, ph * 0.43, 0, 0, TAU); lx.clip();
      revealClip(lx, null, fr, prog); lx.clip();
      lx.drawImage(car.unlit, fr.x, fr.y, fr.w, fr.h);
      lx.restore();
    }
  }
  // 뚜껑 칼자국
  if (t >= T.lidUp[0] && !lid.off) {
    lx.save(); lx.beginPath();
    for (let k = 0; k <= 16; k++) {
      const a = Math.PI * (k / 16), r = k % 2 ? 0.94 : 1;
      const px = Math.cos(a) * pw * 0.2 * r, py = -ph * 0.95 + Math.sin(a) * ph * 0.1 * r;
      k ? lx.lineTo(px, py) : lx.moveTo(px, py);
    }
    lx.strokeStyle = glow > 0 ? rgba(F.mid, 0.4 + 0.6 * glow) : 'rgba(40,15,5,0.7)'; lx.lineWidth = 2; lx.stroke();
    lx.restore();
  }
  // 밤 조명 (불 켜지면 따뜻하게)
  lx.save(); lx.setTransform(1, 0, 0, 1, 0, 0);
  lx.globalCompositeOperation = 'source-atop';
  lx.fillStyle = `rgba(28,22,75,${0.42 * (1 - glow)})`; lx.fillRect(0, 0, lay.width, lay.height);
  if (glow > 0) { lx.fillStyle = rgba(F.edge, 0.12 * glow); lx.fillRect(0, 0, lay.width, lay.height); }
  lx.restore();
  // 빛나는 조각
  if (car && glow > 0) {
    lx.save();
    lx.beginPath(); lx.ellipse(0, -ph * 0.5, pw * 0.44, ph * 0.43, 0, 0, TAU); lx.clip();
    lx.globalAlpha = glow; lx.drawImage(car.lit, fr.x, fr.y, fr.w, fr.h);
    lx.restore();
  }
  c.fillStyle = 'rgba(5,3,12,0.55)';
  c.beginPath(); c.ellipse(x, GROUND - 2, pw * 0.48, Math.max(5, ph * 0.04), 0, 0, TAU); c.fill();
  c.drawImage(lay, x - sp.ox, GROUND - sp.oy);
  // 블룸
  if (car && glow > 0) {
    c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.75 * glow;
    c.translate(x, GROUND);
    const bk = fr.w / car.lit.width, bp = car.BP * bk;
    c.drawImage(car.bloom, fr.x - bp, fr.y - bp, fr.w + bp * 2, fr.h + bp * 2);
    c.restore();
  }
  // 초 넣기
  const cp = pr(t, T.candle);
  if (cp > 0 && cp < 1) {
    const rim = GROUND - ph * 0.94;
    c.save(); c.beginPath(); c.rect(0, 0, W, rim); c.clip();
    candle(c, x, lerp(GROUND - ph * 1.45, rim + 40, easeInOut(cp)), pw / 260, t, F);
    c.restore();
  }
  // 들린 뚜껑
  if (lid.off) {
    c.save(); c.translate(x, GROUND + lid.dy); c.translate(0, -ph * 0.95); c.rotate(lid.rot); c.translate(0, ph * 0.95);
    c.drawImage(sp.lidT, -sp.ox, -sp.oy);
    c.restore();
  }
  // 칼
  if (ch && prog > 0 && prog < 1) {
    const k = knifeLocal(prog, fr);
    knife(c, x + k.x, GROUND + k.y, pw / 240, t);
  }
  return { fr, at: ts => { const k = knifeLocal(carveProgress(ts), fr); return { x: x + k.x, y: GROUND + k.y }; }, seed: i * 31 };
}

function drawScene(c, t) {
  const list = S.chars.length ? S.chars : (DEF ? [DEF] : []);
  const n = Math.max(1, list.length), F = FLAMES[S.flame], glow = glowAt(t);
  drawSky(c, t);
  drawGround(c, glow, F);
  const lay = layout(n), origins = [];
  // 호박 뒤 후광
  if (glow > 0) {
    c.save(); c.globalCompositeOperation = 'lighter';
    for (const L of lay) {
      const cy = GROUND - L.ph * 0.5, r = L.pw * 0.85;
      const g = c.createRadialGradient(L.x, cy, L.pw * 0.2, L.x, cy, r);
      g.addColorStop(0, rgba(F.edge, 0.22 * glow)); g.addColorStop(1, rgba(F.edge, 0));
      c.fillStyle = g; c.fillRect(L.x - r, cy - r, r * 2, r * 2);
    }
    c.restore();
  }
  lay.forEach((L, i) => {
    const o = drawPumpkin(c, i, L, list[i] || null, t, glow, F);
    if (list[i]) origins.push(o);
  });
  chunks(c, t, origins);
  drawBats(c, t);
  // 문구
  const cap = (S.caption || '').trim();
  const cp = pr(t, T.caption);
  if (cap && cp > 0) {
    c.save();
    c.globalAlpha = cp;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    let s = 28; do { c.font = `bold ${s}px ${FONT}`; s--; } while (c.measureText(cap).width > 440 && s > 12);
    c.shadowColor = rgba(F.edge, 0.9); c.shadowBlur = 14;
    c.fillStyle = rgba(F.core);
    c.fillText(cap, W / 2, 466 - (1 - easeOut(cp)) * 10);
    c.restore();
  }
}

/* ===================== 재생 / 소리 ===================== */
let playing = false, startTs = 0, curT = 0, actx = null, fired = new Set();
const startBtn = document.getElementById('start');
function updateBtn() { startBtn.textContent = playing ? '⏹ 멈추기' : (curT > 0 ? '↻ 다시 조각하기' : '🔪 조각 시작'); }
function audio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); return actx; } catch (e) { return null; } }
function tone(f, st, dur, vol, type = 'sine') {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), s0 = a.currentTime + st;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, s0); g.gain.linearRampToValueAtTime(vol, s0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, s0 + dur);
  o.connect(g).connect(a.destination); o.start(s0); o.stop(s0 + dur + 0.05);
}
function scrape() {
  const a = audio(); if (!a) return;
  const len = a.sampleRate * 0.12, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  f.type = 'bandpass'; f.frequency.value = 2400; g.gain.value = 0.12;
  src.buffer = buf; src.connect(f).connect(g).connect(a.destination); src.start();
}
function sounds(t) {
  if (!S.sound) return;
  const ev = [];
  for (let r = 0; r < ROWS; r++) ev.push(['s' + r, T.carve[0] + r * (T.carve[1] - T.carve[0]) / ROWS, scrape]);
  ev.push(['lid', T.lidDown[1], () => tone(220, 0, 0.15, 0.15, 'triangle')]);
  ev.push(['light', T.light[0], () => [440, 523.25, 659.25, 830.6].forEach((f, i) => tone(f, i * 0.13, 1.4, 0.07, 'sine'))]);
  for (const [id, at, fn] of ev) if (t >= at && !fired.has(id)) { fired.add(id); fn(); }
}
function frame(ts) {
  if (playing) {
    curT = (ts - startTs) / 1000;
    sounds(curT);
    if (curT >= T.total) { curT = T.total; playing = false; updateBtn(); }
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawScene(ctx, curT);
  requestAnimationFrame(frame);
}
startBtn.addEventListener('click', () => {
  if (playing) { playing = false; curT = 0; }
  else {
    if (S.sound) { const a = audio(); if (a) a.resume(); }
    curT = 0; startTs = performance.now(); playing = true; fired = new Set();
  }
  updateBtn();
});

document.querySelectorAll('[data-k]').forEach(el => {

/* ===================== 이미지 넣기 ===================== */
const thumbs = document.getElementById('thumbs');
function renderThumbs() {
  thumbs.innerHTML = '';
  S.chars.forEach((ch, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    d.style.backgroundImage = `url(${buildCarve(ch).lit.toDataURL()})`;
    const x = document.createElement('button'); x.textContent = '×'; x.title = '빼기';
    x.onclick = () => { S.chars.splice(i, 1); renderThumbs(); };
    d.appendChild(x); thumbs.appendChild(d);
  });
}
function addFiles(files) {
  const imgs = [...files].filter(f => f.type && f.type.startsWith('image/'));
  const room = 3 - S.chars.length;
  if (room <= 0) { setStatus('호박은 최대 3개까지만 놓을 수 있어요.'); return; }
  imgs.slice(0, room).forEach(f => {
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => { S.chars.push(makeChar(img)); renderThumbs(); URL.revokeObjectURL(url); };
    img.onerror = () => setStatus('이미지를 읽지 못했어요.');
    img.src = url;
  });
  if (imgs.length > room) setStatus('호박은 최대 3개까지만 놓을 수 있어요.');
}
document.getElementById('file').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
const stage = document.getElementById('stage'), drop = document.getElementById('drop');
[stage, drop].forEach(el => {
  el.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('drag'); });
  el.addEventListener('dragleave', () => stage.classList.remove('drag'));
  el.addEventListener('drop', e => { e.preventDefault(); stage.classList.remove('drag'); addFiles(e.dataTransfer.files); });
});
window.addEventListener('paste', e => {
  const fs = [...(e.clipboardData?.items || [])].filter(it => it.kind === 'file').map(it => it.getAsFile()).filter(Boolean);
  if (fs.length) addFiles(fs);
});

/* ===================== GIF 저장 ===================== */
const statusEl = document.getElementById('status');
const setStatus = s => statusEl.textContent = s;
const gifBtn = document.getElementById('gif');
const WORKER_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';
let workerURL = null;
gifBtn.addEventListener('click', async () => {
  if (typeof GIF === 'undefined') { setStatus('GIF 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); return; }
  gifBtn.disabled = true;
  try {
    setStatus('준비 중…');
    if (!workerURL) {
      const r = await fetch(WORKER_SRC);
      workerURL = URL.createObjectURL(await r.blob());
    }
    const scale = parseFloat(document.getElementById('gifsize').value);
    const gw = Math.round(W * scale), gh = Math.round(H * scale);
    const oc = mk(gw, gh), ox = oc.getContext('2d');
    const gif = new GIF({ workers: 2, quality: 10, width: gw, height: gh, workerScript: workerURL });
    const fps = 15, nF = Math.ceil(T.total * fps);
    for (let f = 0; f <= nF; f++) {
      const t = Math.min(f / fps, T.total);
      ox.setTransform(scale, 0, 0, scale, 0, 0);
      drawScene(ox, t);
      gif.addFrame(ox, { copy: true, delay: f === nF ? 2000 : Math.round(1000 / fps) });
      if (f % 10 === 0) { setStatus(`프레임 그리는 중… ${f}/${nF}`); await new Promise(r => setTimeout(r, 0)); }
    }

      gifBtn.disabled = false;
    });
    gif.render();
  } catch (err) {
    setStatus('GIF 만들기에 실패했어요: ' + err.message);
    gifBtn.disabled = false;
  }
});
